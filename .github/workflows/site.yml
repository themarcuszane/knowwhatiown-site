name: site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"   # weekly live smoke test (Mondays)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static QA
        run: python3 -I tests/qa.py site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: always() && (needs.deploy.result == 'success' || github.event_name == 'schedule')
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the deployment to be served
        run: sleep 45
      - name: Live smoke test
        run: tests/smoke.sh https://knowwhatiown.com
